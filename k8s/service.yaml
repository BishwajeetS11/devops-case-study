# Task 3 – Containerization & Orchestration
# Kubernetes Service Manifest
# DevOps Case Study – Bishwajeet S
# ═══════════════════════════════════════════════════════════════

apiVersion: v1
kind: Service
metadata:
  name: devops-case-study-svc
  namespace: default
  labels:
    app: devops-case-study-app
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "5000"
    prometheus.io/path: "/metrics"
spec:
  type: NodePort
  selector:
    app: devops-case-study-app
  ports:
    - name: http
      protocol: TCP
      port: 80          # Service port (cluster-internal)
      targetPort: 5000  # Container port
      nodePort: 30082   # Externally accessible port on node

---
# ─────────────────────────────────────────────
# HorizontalPodAutoscaler
# Scales 2–6 replicas based on CPU usage
# ─────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-case-study-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-case-study-app
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
