# ═══════════════════════════════════════════════════════════════
# Task 2 – Configuration Management & IaC
# Ansible Inventory File
# DevOps Case Study – Bishwajeet S
# ═══════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────
# Web / Application Servers
# ─────────────────────────────────────────────
[webservers]
web01 ansible_host=192.168.1.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa
web02 ansible_host=192.168.1.11 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

# ─────────────────────────────────────────────
# Monitoring Server
# ─────────────────────────────────────────────
[monitoring]
monitor01 ansible_host=192.168.1.20 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

# ─────────────────────────────────────────────
# All servers grouped together
# ─────────────────────────────────────────────
[all_servers:children]
webservers
monitoring

# ─────────────────────────────────────────────
# Global Variables
# ─────────────────────────────────────────────
[all_servers:vars]
ansible_python_interpreter=/usr/bin/python3
app_user=devopsuser
app_group=devopsgroup
app_dir=/opt/devops-app
docker_compose_version=2.27.0
