---
# ═══════════════════════════════════════════════════════════════
# Task 2 – Configuration Management & IaC
# Ansible Playbook – Runtime Environment Setup
# DevOps Case Study – Bishwajeet S
#
# Usage:
#   ansible-playbook -i ansible/inventory.ini ansible/playbook.yml
#   ansible-playbook -i ansible/inventory.ini ansible/playbook.yml --tags docker
#   ansible-playbook -i ansible/inventory.ini ansible/playbook.yml --check   # dry-run
# ═══════════════════════════════════════════════════════════════

- name: "Play 1 – Bootstrap all servers"
  hosts: all_servers
  become: yes
  gather_facts: yes

  vars:
    app_user: devopsuser
    app_group: devopsgroup
    app_dir: /opt/devops-app
    log_dir: /var/log/devops-app
    config_dir: /etc/devops-app
    required_packages:
      - curl
      - wget
      - git
      - vim
      - htop
      - net-tools
      - ca-certificates
      - gnupg
      - lsb-release
      - python3-pip
      - python3-venv
      - unzip

  tasks:
    # ─────────────────────────────────────────────
    # System update & base packages
    # ─────────────────────────────────────────────
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      tags: [packages, always]

    - name: Upgrade all system packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: yes
      tags: [packages]

    - name: Install required base packages
      ansible.builtin.apt:
        name: "{{ required_packages }}"
        state: present
      tags: [packages]

    # ─────────────────────────────────────────────
    # Create application user & group
    # ─────────────────────────────────────────────
    - name: Create application group
      ansible.builtin.group:
        name: "{{ app_group }}"
        state: present
        system: yes
      tags: [users]

    - name: Create application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        system: yes
        shell: /bin/bash
        home: "/home/{{ app_user }}"
        create_home: yes
        comment: "DevOps Application Service Account"
        state: present
      tags: [users]

    - name: Add app user to sudoers (limited)
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ app_user }}"
        content: |
          # Allow devopsuser to restart the app service only
          {{ app_user }} ALL=(root) NOPASSWD: /bin/systemctl restart devops-app, \
                                               /bin/systemctl start devops-app, \
                                               /bin/systemctl stop devops-app, \
                                               /bin/systemctl status devops-app
        mode: "0440"
        validate: "visudo -cf %s"
      tags: [users]

    # ─────────────────────────────────────────────
    # Directory structure
    # ─────────────────────────────────────────────
    - name: Create application directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"
      loop:
        - "{{ app_dir }}"
        - "{{ app_dir }}/releases"
        - "{{ app_dir }}/shared"
        - "{{ log_dir }}"
        - "{{ config_dir }}"
      tags: [directories]

    # ─────────────────────────────────────────────
    # Configuration files
    # ─────────────────────────────────────────────
    - name: Deploy application environment config
      ansible.builtin.copy:
        dest: "{{ config_dir }}/app.env"
        content: |
          # DevOps Case Study App – Environment Config
          # Managed by Ansible – DO NOT EDIT MANUALLY
          FLASK_ENV=production
          APP_PORT=5000
          LOG_LEVEL=INFO
          LOG_DIR={{ log_dir }}
          APP_DIR={{ app_dir }}
          APP_USER={{ app_user }}
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0640"
      tags: [config]

    - name: Deploy logrotate config for app logs
      ansible.builtin.copy:
        dest: "/etc/logrotate.d/devops-app"
        content: |
          {{ log_dir }}/*.log {
              daily
              missingok
              rotate 14
              compress
              delaycompress
              notifempty
              sharedscripts
              postrotate
                  systemctl reload devops-app > /dev/null 2>&1 || true
              endscript
          }
        mode: "0644"
      tags: [config, logging]

    # ─────────────────────────────────────────────
    # SSH hardening
    # ─────────────────────────────────────────────
    - name: Harden SSH configuration
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
        backup: yes
      loop:
        - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
        - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
        - { regexp: '^#?X11Forwarding', line: 'X11Forwarding no' }
        - { regexp: '^#?MaxAuthTries', line: 'MaxAuthTries 3' }
      notify: Restart SSH
      tags: [security]

    # ─────────────────────────────────────────────
    # UFW Firewall
    # ─────────────────────────────────────────────
    - name: Enable UFW and set default policies
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming
      tags: [security, firewall]

    - name: Allow SSH through firewall
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
      tags: [security, firewall]

    - name: Allow app port through firewall
      community.general.ufw:
        rule: allow
        port: "5000"
        proto: tcp
      tags: [security, firewall]

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: sshd
        state: restarted


# ═══════════════════════════════════════════════════════════════
# Play 2 – Install Docker on web servers
# ═══════════════════════════════════════════════════════════════
- name: "Play 2 – Install Docker & Deploy App"
  hosts: webservers
  become: yes
  gather_facts: yes

  vars:
    docker_compose_version: "2.27.0"
    app_user: devopsuser
    app_group: devopsgroup
    app_dir: /opt/devops-app

  tasks:
    # ─────────────────────────────────────────────
    # Docker installation
    # ─────────────────────────────────────────────
    - name: Add Docker GPG apt key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
      tags: [docker]

    - name: Add Docker APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
      tags: [docker]

    - name: Install Docker CE
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes
      tags: [docker]

    - name: Start and enable Docker service
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes
      tags: [docker]

    - name: Add app user to docker group
      ansible.builtin.user:
        name: "{{ app_user }}"
        groups: docker
        append: yes
      tags: [docker, users]

    # ─────────────────────────────────────────────
    # Deploy application via Docker
    # ─────────────────────────────────────────────
    - name: Copy docker-compose file to server
      ansible.builtin.copy:
        src: ../monitoring/docker-compose.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0644"
      tags: [deploy]

    - name: Pull latest Docker image
      community.docker.docker_image:
        name: bishwajeets11/devops-case-study-app
        tag: latest
        source: pull
        force_source: yes
      tags: [deploy]

    - name: Deploy application with Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present
        pull: always
      tags: [deploy]

    # ─────────────────────────────────────────────
    # Verify deployment
    # ─────────────────────────────────────────────
    - name: Wait for app to be healthy
      ansible.builtin.uri:
        url: "http://localhost:5000/health"
        status_code: 200
        timeout: 30
      retries: 5
      delay: 10
      register: health_check
      until: health_check.status == 200
      tags: [verify]

    - name: Show health check result
      ansible.builtin.debug:
        msg: "App is healthy: {{ health_check.json }}"
      tags: [verify]


# ═══════════════════════════════════════════════════════════════
# Play 3 – Install Prometheus & Grafana on monitoring server
# ═══════════════════════════════════════════════════════════════
- name: "Play 3 – Setup Monitoring Stack"
  hosts: monitoring
  become: yes
  gather_facts: yes

  vars:
    prometheus_version: "2.52.0"
    grafana_version: "10.4.2"
    prometheus_dir: /etc/prometheus
    prometheus_data: /var/lib/prometheus

  tasks:
    - name: Create prometheus user
      ansible.builtin.user:
        name: prometheus
        system: yes
        shell: /bin/false
        create_home: no
      tags: [prometheus]

    - name: Create prometheus directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: prometheus
        group: prometheus
        mode: "0755"
      loop:
        - "{{ prometheus_dir }}"
        - "{{ prometheus_data }}"
      tags: [prometheus]

    - name: Download and extract Prometheus
      ansible.builtin.unarchive:
        src: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
        dest: /tmp
        remote_src: yes
      tags: [prometheus]

    - name: Install prometheus binaries
      ansible.builtin.copy:
        src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        mode: "0755"
        remote_src: yes
      loop:
        - prometheus
        - promtool
      tags: [prometheus]

    - name: Deploy Prometheus configuration
      ansible.builtin.copy:
        dest: "{{ prometheus_dir }}/prometheus.yml"
        content: |
          global:
            scrape_interval: 15s
            evaluation_interval: 15s

          scrape_configs:
            - job_name: 'devops-case-study-app'
              static_configs:
                - targets:
                  {% for host in groups['webservers'] %}
                    - '{{ hostvars[host].ansible_host }}:5000'
                  {% endfor %}
              metrics_path: /metrics

            - job_name: 'prometheus'
              static_configs:
                - targets: ['localhost:9090']
        owner: prometheus
        group: prometheus
        mode: "0644"
      notify: Restart Prometheus
      tags: [prometheus]

    - name: Create Prometheus systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/prometheus.service
        content: |
          [Unit]
          Description=Prometheus Monitoring
          After=network.target

          [Service]
          User=prometheus
          Group=prometheus
          Type=simple
          ExecStart=/usr/local/bin/prometheus \
              --config.file={{ prometheus_dir }}/prometheus.yml \
              --storage.tsdb.path={{ prometheus_data }} \
              --web.listen-address=:9090 \
              --storage.tsdb.retention.time=15d
          Restart=always

          [Install]
          WantedBy=multi-user.target
        mode: "0644"
      notify: Restart Prometheus
      tags: [prometheus]

    - name: Enable and start Prometheus
      ansible.builtin.systemd:
        name: prometheus
        daemon_reload: yes
        state: started
        enabled: yes
      tags: [prometheus]

    - name: Add Grafana APT key and repo
      block:
        - ansible.builtin.apt_key:
            url: https://apt.grafana.com/gpg.key
            state: present
        - ansible.builtin.apt_repository:
            repo: "deb https://apt.grafana.com stable main"
            state: present
            filename: grafana
      tags: [grafana]

    - name: Install Grafana
      ansible.builtin.apt:
        name: grafana
        state: present
        update_cache: yes
      tags: [grafana]

    - name: Enable and start Grafana
      ansible.builtin.systemd:
        name: grafana-server
        state: started
        enabled: yes
      tags: [grafana]

    - name: Allow Prometheus port through firewall
      community.general.ufw:
        rule: allow
        port: "9090"
        proto: tcp
      tags: [firewall, prometheus]

    - name: Allow Grafana port through firewall
      community.general.ufw:
        rule: allow
        port: "3000"
        proto: tcp
      tags: [firewall, grafana]

  handlers:
    - name: Restart Prometheus
      ansible.builtin.systemd:
        name: prometheus
        state: restarted
