# ═══════════════════════════════════════════════════════════════════
# Task 1 – Deployment Strategy
# GitHub Actions CI/CD Pipeline
# DevOps Case Study – Bishwajeet S
# ═══════════════════════════════════════════════════════════════════

name: CI/CD Pipeline – DevOps Case Study

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE: bishwajeets11/devops-case-study-app
  DOCKER_TAG: ${{ github.sha }}

jobs:
  # ─────────────────────────────────────────────────────
  # JOB 1: Lint & Unit Tests
  # ─────────────────────────────────────────────────────
  test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install flake8 pytest

      - name: Lint with flake8
        run: |
          flake8 app/app.py tests/ --max-line-length=120

      - name: Run unit tests
        run: |
          PYTHONPATH=. pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────────────
  # JOB 2: Build & Push Docker Image
  # ─────────────────────────────────────────────────────
  build:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKER_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: ${{ secrets.DOCKER_USERNAME != '' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.DOCKER_IMAGE }}:latest"
          format: "table"
          exit-code: "0"          # warn only – don't break pipeline
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

  # ─────────────────────────────────────────────────────
  # JOB 3: Deploy to Kubernetes (Staging)
  # ─────────────────────────────────────────────────────
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: http://staging.devops-demo.local
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.30.0"

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > kubeconfig.yaml
          echo "KUBECONFIG=${{ github.workspace }}/kubeconfig.yaml" >> "$GITHUB_ENV"

      - name: Update image tag in deployment
        run: |
          sed -i "s|IMAGE_TAG|${{ env.DOCKER_IMAGE }}:sha-$(echo ${{ github.sha }} | head -c7)|g" \
            k8s/deployment.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/ --namespace=staging
          kubectl rollout status deployment/devops-case-study-app \
            --namespace=staging --timeout=120s

  # ─────────────────────────────────────────────────────
  # JOB 4: Deploy to Production
  # ─────────────────────────────────────────────────────
  deploy-production:
    name: 🏁 Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: http://devops-demo.local
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.30.0"

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > kubeconfig.yaml
          echo "KUBECONFIG=${{ github.workspace }}/kubeconfig.yaml" >> "$GITHUB_ENV"

      - name: Rolling update – patch image
        run: |
          kubectl set image deployment/devops-case-study-app \
            app=${{ env.DOCKER_IMAGE }}:sha-$(echo ${{ github.sha }} | head -c7) \
            --namespace=production

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/devops-case-study-app \
            --namespace=production --timeout=180s

      - name: Verify deployment health
        run: |
          kubectl get pods --namespace=production -l app=devops-case-study-app
          kubectl get svc  --namespace=production

  # ─────────────────────────────────────────────────────
  # JOB 5: Notify on Failure
  # ─────────────────────────────────────────────────────
  notify:
    name: 🔔 Notify on Failure
    runs-on: ubuntu-latest
    needs: [test, build, deploy-staging, deploy-production]
    if: failure()
    steps:
      - name: Send failure notification
        run: |
          echo "Pipeline failed! Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
          echo "Author: ${{ github.actor }}"
          # Replace with Slack/email webhook in production
